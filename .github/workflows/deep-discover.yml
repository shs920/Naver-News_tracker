name: Deep discover news

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

env:
  SEED_KEYWORDS: "빙그레,삼양식품,농심,CJ제일제당,오뚜기,오리온,롯데웰푸드,롯데칠성,대상,동원F&B,매일유업,남양유업,서울우유,하림,삼립,해태,hy,하이트진로,오비맥주,스타벅스,아워홈"
  DISCOVERY_EXCLUDED_KEYWORDS: "대상웰라이프,BBQ,BHC,교촌"
  RETIRED_KEYWORDS: "BBQ,BHC,교촌"
  PREFILTER_SEARCH_RESULTS: "false"
  REQUEST_TIMEOUT: "15"

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r crawler/requirements.txt

      - name: Check external services
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python crawler/preflight.py

  deep-discover:
    name: deep-discover-${{ matrix.group }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: news-crawler-deep-discover-${{ matrix.group }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [0, 1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r crawler/requirements.txt

      - name: Deep discover articles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          CRAWLER_MODE: "discover"
          KEYWORD_GROUP_INDEX: ${{ matrix.group }}
          KEYWORD_GROUP_COUNT: "4"
          MAX_KEYWORDS_PER_RUN: "0"
          MAX_RESULTS_PER_KEYWORD: "150"
          MAX_SEARCH_PAGES: "2"
          NAVER_HTML_SEARCH_ENABLED: "true"
          MAX_HTML_SEARCH_PAGES: "2"
          DISCOVERY_RECHECK_EXISTING: "false"
          MAX_RUN_SECONDS: "900"
          MAX_NEW_ARTICLES_PER_KEYWORD: "0"
        run: python crawler/main.py
